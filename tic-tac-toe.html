<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe</title>
<style>
  :root {
    --bg: #f5f5f4; --surface: #ffffff; --text: #1c1917; --muted: #78716c;
    --line: #d6d3d1; --x: #2563eb; --o: #dc2626; --win: #fde68a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --surface: #292524; --text: #f5f5f4; --muted: #a8a29e;
      --line: #44403c; --x: #60a5fa; --o: #f87171; --win: #854d0e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px; padding: 16px;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { margin: 0; font-size: 2rem; letter-spacing: -0.02em; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button.opt, #reset {
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    padding: 8px 14px; border-radius: 8px; font-size: 0.95rem; cursor: pointer;
  }
  button.opt.active { border-color: var(--text); font-weight: 600; }
  #status { font-size: 1.15rem; min-height: 1.5em; font-weight: 500; }
  #board {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    width: min(360px, 100%); aspect-ratio: 1;
  }
  .cell {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    font-size: clamp(2.5rem, 14vw, 4.5rem); font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
    transition: background 0.15s, transform 0.1s;
  }
  .cell:hover:not(:disabled) { transform: scale(1.03); }
  .cell:disabled { cursor: default; }
  .cell.X { color: var(--x); }
  .cell.O { color: var(--o); }
  .cell.win { background: var(--win); }
  .score { display: flex; gap: 24px; color: var(--muted); font-size: 0.95rem; }
  .score b { color: var(--text); }
</style>
</head>
<body>
  <h1>Tic Tac Toe</h1>

  <div class="controls">
    <button class="opt active" data-mode="cpu">vs Computer</button>
    <button class="opt" data-mode="pvp">2 Players</button>
  </div>

  <div id="status"></div>
  <div id="board"></div>

  <div class="score">
    <span>X: <b id="sx">0</b></span>
    <span>Draws: <b id="sd">0</b></span>
    <span>O: <b id="so">0</b></span>
  </div>

  <button id="reset">New game</button>

<script>
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const score = { X: 0, O: 0, D: 0 };
  let board, turn, over, mode = 'cpu';

  const cells = Array.from({ length: 9 }, (_, i) => {
    const b = document.createElement('button');
    b.className = 'cell';
    b.setAttribute('aria-label', 'Cell ' + (i + 1));
    b.addEventListener('click', () => play(i));
    boardEl.appendChild(b);
    return b;
  });

  function winner(b) {
    for (const l of LINES) {
      const [a, c, d] = l;
      if (b[a] && b[a] === b[c] && b[a] === b[d]) return { player: b[a], line: l };
    }
    return b.every(Boolean) ? { player: null } : null;
  }

  // Minimax: the computer (O) never loses
  function minimax(b, player) {
    const w = winner(b);
    if (w) return { score: w.player === 'O' ? 10 : w.player === 'X' ? -10 : 0 };
    let best = { score: player === 'O' ? -Infinity : Infinity };
    for (let i = 0; i < 9; i++) {
      if (b[i]) continue;
      b[i] = player;
      const s = minimax(b, player === 'O' ? 'X' : 'O').score;
      b[i] = null;
      const adj = s > 0 ? s - 1 : s < 0 ? s + 1 : 0; // prefer faster wins
      if (player === 'O' ? adj > best.score : adj < best.score) best = { score: adj, move: i };
    }
    return best;
  }

  function play(i) {
    if (over || board[i]) return;
    if (mode === 'cpu' && turn === 'O') return;
    place(i);
    if (!over && mode === 'cpu' && turn === 'O') {
      render();
      setTimeout(() => place(minimax(board.slice(), 'O').move), 350);
    }
  }

  function place(i) {
    board[i] = turn;
    const w = winner(board);
    if (w) {
      over = true;
      if (w.player) { score[w.player]++; w.line.forEach(k => cells[k].classList.add('win')); }
      else score.D++;
      statusEl.textContent = w.player ? `${w.player} wins!` : "It's a draw!";
    } else {
      turn = turn === 'X' ? 'O' : 'X';
    }
    render();
  }

  function render() {
    board.forEach((v, i) => {
      cells[i].textContent = v || '';
      cells[i].className = 'cell' + (v ? ' ' + v : '') + (cells[i].classList.contains('win') ? ' win' : '');
      cells[i].disabled = over || !!v;
    });
    if (!over) {
      statusEl.textContent = mode === 'cpu' && turn === 'O' ? 'Computer is thinking…' : `${turn}'s turn`;
    }
    document.getElementById('sx').textContent = score.X;
    document.getElementById('so').textContent = score.O;
    document.getElementById('sd').textContent = score.D;
  }

  function reset() {
    board = Array(9).fill(null);
    turn = 'X';
    over = false;
    cells.forEach(c => c.classList.remove('win'));
    render();
  }

  document.getElementById('reset').addEventListener('click', reset);
  document.querySelectorAll('.opt').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.opt').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    score.X = score.O = score.D = 0;
    reset();
  }));

  reset();
</script>
</body>
</html>
