<script>
// Tiny test runner: open this file in a browser, no server needed.
const results = [];
function test(name, fn) {
  try { fn(); results.push({ name, ok: true }); }
  catch (e) { results.push({ name, ok: false, err: e.message }); }
}
function eq(actual, expected, label) {
  if (JSON.stringify(actual) !== JSON.stringify(expected)) {
    throw new Error((label ? label + ': ' : '') + 'expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual));
  }
}

// Fake storage standing in for localStorage.
function fakeStorage(initial) {
  const data = Object.assign({}, initial);
  return {
    data,
    getItem(k) { return k in data ? data[k] : null; },
    setItem(k, v) { data[k] = String(v); },
    removeItem(k) { delete data[k]; },
  };
}

// Independent fixture: 3 chapters, deliberately not the real game data.
const CHAPTERS = [
  { id: 'a', levels: 3 },
  { id: 'b', levels: 2 },
  { id: 'c', levels: 2 },
];
function fresh(storage) { return Progression.create({ storage: storage || fakeStorage(), chapters: CHAPTERS }); }

// ---- tests ----
test('at the start only the first chapter is unlocked', () => {
  const p = fresh();
  eq(p.isChapterUnlocked('a'), true, 'a');
  eq(p.isChapterUnlocked('b'), false, 'b');
  eq(p.isChapterUnlocked('c'), false, 'c');
});

test('starting a chapter gives level 1 and 3 lives', () => {
  const p = fresh();
  eq(p.startChapter('a'), true);
  eq(p.run, { chapter: 'a', level: 1, lives: 3 });
});

test('a locked chapter cannot be started', () => {
  const p = fresh();
  eq(p.startChapter('b'), false);
  eq(p.run, null);
});

test('passing a level moves to the next one', () => {
  const p = fresh();
  p.startChapter('a');
  eq(p.levelPassed(), { chapterCompleted: false });
  eq(p.run, { chapter: 'a', level: 2, lives: 3 });
});

test('losing a life keeps the level and lives are not refilled by the next level', () => {
  const p = fresh();
  p.startChapter('a');
  eq(p.lifeLost(), { gameOver: false });
  eq(p.run, { chapter: 'a', level: 1, lives: 2 });
  p.levelPassed();
  eq(p.run, { chapter: 'a', level: 2, lives: 2 });
});

test('losing the last life restarts the chapter from level 1 with 3 lives', () => {
  const p = fresh();
  p.startChapter('a');
  p.levelPassed();
  p.lifeLost();
  p.lifeLost();
  eq(p.lifeLost(), { gameOver: true });
  eq(p.run, { chapter: 'a', level: 1, lives: 3 });
});

function complete(p, id, levels) {
  p.startChapter(id);
  let r;
  for (let i = 0; i < levels; i++) r = p.levelPassed();
  return r;
}

test('endless is locked until its chapter is completed', () => {
  const p = fresh();
  eq(p.isEndlessUnlocked('a'), false);
  p.startChapter('a');
  p.levelPassed();
  eq(p.isEndlessUnlocked('a'), false);
});

test('completing a chapter unlocks the next chapter and its own endless only', () => {
  const p = fresh();
  eq(complete(p, 'a', 3), { chapterCompleted: true });
  eq(p.run, null);
  eq(p.isChapterCompleted('a'), true);
  eq(p.isChapterUnlocked('b'), true);
  eq(p.isChapterUnlocked('c'), false);
  eq(p.isEndlessUnlocked('a'), true);
  eq(p.isEndlessUnlocked('b'), false);
});

test('unlocks survive a game over in a later chapter', () => {
  const p = fresh();
  complete(p, 'a', 3);
  p.startChapter('b');
  p.lifeLost(); p.lifeLost(); p.lifeLost();
  eq(p.isChapterCompleted('a'), true);
  eq(p.isChapterUnlocked('b'), true);
  eq(p.isEndlessUnlocked('a'), true);
});

test('a completed chapter can be replayed from level 1 without losing unlocks', () => {
  const p = fresh();
  complete(p, 'a', 3);
  eq(p.startChapter('a'), true);
  eq(p.run, { chapter: 'a', level: 1, lives: 3 });
  p.lifeLost(); p.lifeLost(); p.lifeLost();
  eq(p.isChapterUnlocked('b'), true);
  eq(p.isEndlessUnlocked('a'), true);
});

test('endless record starts at 0 and updates only when beaten', () => {
  const p = fresh();
  complete(p, 'a', 3);
  eq(p.record('a'), 0);
  eq(p.submitEndless('a', 120), true);
  eq(p.record('a'), 120);
  eq(p.submitEndless('a', 80), false);
  eq(p.submitEndless('a', 120), false);
  eq(p.record('a'), 120);
  eq(p.submitEndless('a', 121), true);
  eq(p.record('a'), 121);
});

test('records are kept per chapter', () => {
  const p = fresh();
  complete(p, 'a', 3);
  complete(p, 'b', 2);
  p.submitEndless('a', 10);
  p.submitEndless('b', 99);
  eq([p.record('a'), p.record('b'), p.record('c')], [10, 99, 0]);
});

test('an endless score is ignored while that endless is locked', () => {
  const p = fresh();
  eq(p.submitEndless('a', 50), false);
  eq(p.record('a'), 0);
});

test('a reloaded game resumes at the saved level and lives', () => {
  const s = fakeStorage();
  const p = fresh(s);
  complete(p, 'a', 3);
  p.submitEndless('a', 42);
  p.startChapter('b');
  p.lifeLost();
  const q = fresh(s);
  eq(q.run, { chapter: 'b', level: 1, lives: 2 });
  eq(q.isChapterCompleted('a'), true);
  eq(q.isChapterUnlocked('b'), true);
  eq(q.record('a'), 42);
});

test('a reloaded game remembers a level passed mid-chapter', () => {
  const s = fakeStorage();
  const p = fresh(s);
  p.startChapter('a');
  p.levelPassed();
  eq(fresh(s).run, { chapter: 'a', level: 2, lives: 3 });
});

test('a game over is saved as a fresh attempt at level 1', () => {
  const s = fakeStorage();
  const p = fresh(s);
  p.startChapter('a');
  p.levelPassed();
  p.lifeLost(); p.lifeLost(); p.lifeLost();
  eq(fresh(s).run, { chapter: 'a', level: 1, lives: 3 });
});

test('reset returns to the initial state, also after reload', () => {
  const s = fakeStorage();
  const p = fresh(s);
  complete(p, 'a', 3);
  p.submitEndless('a', 42);
  p.startChapter('b');
  p.reset();
  for (const g of [p, fresh(s)]) {
    eq(g.run, null);
    eq(g.isChapterUnlocked('a'), true);
    eq(g.isChapterUnlocked('b'), false);
    eq(g.isChapterCompleted('a'), false);
    eq(g.record('a'), 0);
  }
});

test('missing or corrupted saves give a valid initial state', () => {
  const bad = [
    'not json at all',
    '{"v":1,',
    'null',
    '42',
    '"text"',
    '{"v":1,"completed":"a","records":[],"run":7}',
  ];
  for (const raw of bad) {
    const p = fresh(fakeStorage({ [Progression.KEY]: raw }));
    eq(p.run, null, raw);
    eq(p.isChapterUnlocked('a'), true, raw);
    eq(p.isChapterUnlocked('b'), false, raw);
    eq(p.record('a'), 0, raw);
  }
});

test('nonsense values inside a readable save are discarded', () => {
  const save = {
    v: 1,
    completed: ['zzz', 'b'],            // unknown chapter, and b without a completed
    records: { a: -5, b: 'x', zzz: 9 },
    run: { chapter: 'c', level: 1, lives: 3 }, // c is locked
  };
  const p = fresh(fakeStorage({ [Progression.KEY]: JSON.stringify(save) }));
  eq(p.run, null);
  eq(p.isChapterUnlocked('c'), false);
  eq([p.record('a'), p.record('b')], [0, 0]);
});

test('a saved run with out-of-range level or lives is discarded', () => {
  for (const run of [
    { chapter: 'a', level: 99, lives: 3 },
    { chapter: 'a', level: 0, lives: 3 },
    { chapter: 'a', level: 1, lives: 0 },
    { chapter: 'a', level: 1, lives: 9 },
    { chapter: 'a', level: 1.5, lives: 3 },
  ]) {
    const raw = JSON.stringify({ v: 1, completed: [], records: {}, run });
    eq(fresh(fakeStorage({ [Progression.KEY]: raw })).run, null, JSON.stringify(run));
  }
});

test('the game still works when storage is unavailable', () => {
  const broken = {
    getItem() { throw new Error('denied'); },
    setItem() { throw new Error('denied'); },
    removeItem() { throw new Error('denied'); },
  };
  const p = fresh(broken);
  eq(p.startChapter('a'), true);
  p.levelPassed();
  eq(p.run, { chapter: 'a', level: 2, lives: 3 });
  p.reset();
  eq(p.run, null);
});

test('level and life events without an active run are ignored', () => {
  const p = fresh();
  eq(p.levelPassed(), null);
  eq(p.lifeLost(), null);
  complete(p, 'a', 3);
  eq(p.levelPassed(), null, 'double signal after the last level');
  eq(p.lifeLost(), null);
  eq(p.run, null);
  eq(p.isChapterCompleted('a'), true);
  eq(p.isChapterCompleted('b'), false);
});

test('endless scores that are not finite numbers are ignored', () => {
  const p = fresh();
  complete(p, 'a', 3);
  for (const bad of [NaN, Infinity, '50', null, undefined]) eq(p.submitEndless('a', bad), false, String(bad));
  eq(p.record('a'), 0);
});


// ---- Jump Guy ----
const STEP = 1 / 60;
function seeded(seed) { // mulberry32, so level layouts are reproducible in tests
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const LEVEL1 = JumpGuy.buildLevel(1, seeded(1));
// Runs a level with a simple bot; jumpWhen(sim) decides when to press.
function runBot(def, jumpWhen, maxSteps) {
  const sim = JumpGuy.create(def);
  for (let i = 0; i < (maxSteps || 6000); i++) {
    const ev = sim.update(STEP, { pressed: !!jumpWhen && jumpWhen(sim) });
    if (ev) return { ev, sim, steps: i + 1 };
  }
  return { ev: null, sim };
}
// Jumps so that the middle of the next obstacle group is under the runner at the top of the arc.
const bot = sim => {
  if (!sim.grounded) return false;
  const rear = sim.dist + JumpGuy.PLAYER_X, center = rear + JumpGuy.PLAYER_W / 2;
  const g = sim.def.groups.find(g => g.x + g.span > rear);
  return !!g && g.x + g.span / 2 - center <= (sim.def.speedAt ? sim.def.speedAt(sim.dist) : sim.def.speed) * 0.37;
};

test('doing nothing hits the first obstacle', () => {
  const r = runBot(LEVEL1, null);
  eq(r.ev, 'hit');
  eq(r.sim.state, 'hit');
});

test('jumping before each obstacle reaches the finish', () => {
  const r = runBot(LEVEL1, bot);
  eq(r.ev, 'passed');
});

test('a finished level reports its event only once', () => {
  const r = runBot(LEVEL1, bot);
  eq(r.sim.update(STEP, { pressed: true }), null);
  const h = runBot(LEVEL1, null);
  eq(h.sim.update(STEP, {}), null);
});

test('the jump button lifts the runner and gravity brings it back', () => {
  const sim = JumpGuy.create({ length: 9999, obstacles: [] });
  sim.update(STEP, { pressed: true });
  eq(sim.grounded, false);
  let peak = sim.y;
  for (let i = 0; i < 120; i++) { sim.update(STEP, {}); peak = Math.min(peak, sim.y); }
  eq(sim.grounded, true);
  eq(peak < JumpGuy.GROUND - 50, true, 'jump is high enough');
});

test('a jump pressed slightly before landing still fires (buffer)', () => {
  const sim = JumpGuy.create({ length: 9999, obstacles: [] });
  sim.update(STEP, { pressed: true });
  while (sim.y < JumpGuy.GROUND - 4) sim.update(STEP, {}); // nearly landed
  sim.update(STEP, { pressed: true });
  for (let i = 0; i < 20; i++) sim.update(STEP, {});
  eq(sim.grounded, false, 'airborne again after landing');
});

test('a jump pressed just after leaving the ground still fires (edge tolerance)', () => {
  const sim = JumpGuy.create({ length: 9999, obstacles: [] });
  sim.grounded = false; sim.sinceGround = 0.05; sim.vy = 0; sim.y = JumpGuy.GROUND - 1;
  sim.update(STEP, { pressed: true });
  eq(sim.vy < 0, true);
});

test('an obstacle grazing the edge of the hitbox is forgiven', () => {
  const x = JumpGuy.PLAYER_X + JumpGuy.PLAYER_W + 1; // overlaps by 1px, less than the forgiveness
  const sim = JumpGuy.create({ length: 9999, obstacles: [{ x, w: 14, h: 14 }] });
  eq(sim.hitsObstacle(), false);
});

test('level data: about 5 levels, speed never decreases and ends at the maximum', () => {
  const lv = JumpGuyData.levels;
  eq(lv.length >= 4 && lv.length <= 6, true, 'about 5 levels');
  for (let i = 1; i < lv.length; i++) eq(lv[i].speed >= lv[i - 1].speed, true, 'speed at level ' + (i + 1));
  eq(lv[lv.length - 1].speed, Math.max(...lv.map(l => l.speed)));
});

test('there are 20 to 30 obstacle patterns', () => {
  const n = JumpGuyData.patterns.length;
  eq(n >= 20 && n <= 30, true, String(n));
});

test('every level has patterns in random order and varies between builds', () => {
  const a = JumpGuy.buildLevel(5, seeded(1)), b = JumpGuy.buildLevel(5, seeded(2));
  eq(a.obstacles.length > 10, true);
  eq(JSON.stringify(a.obstacles) !== JSON.stringify(b.obstacles), true);
});

test('lower levels only use patterns up to their tier', () => {
  const easy = JumpGuyData.patterns.filter(p => p.tier <= JumpGuyData.levels[0].maxTier);
  const maxH = Math.max(...easy.flatMap(p => p.o.map(o => o[2])));
  for (let s = 1; s <= 5; s++) eq(JumpGuy.buildLevel(1, seeded(s)).obstacles.every(o => o.h <= maxH), true);
});

test('every pattern can be cleared with one jump at every level speed it appears in', () => {
  JumpGuyData.levels.forEach((cfg, li) => {
    for (const p of JumpGuyData.patterns.filter(p => p.tier <= cfg.maxTier)) {
      const obstacles = p.o.map(([dx, w, h]) => ({ x: 200 + dx, w, h }));
      let cleared = false;
      for (let start = 0; start < 200 && !cleared; start++) { // try every jump moment
        const sim = JumpGuy.create({ length: 420, speed: cfg.speed, obstacles });
        let ev = null;
        for (let i = 0; i < 400 && !ev; i++) ev = sim.update(STEP, { pressed: i === start });
        cleared = ev === 'passed';
      }
      eq(cleared, true, 'level ' + (li + 1) + ' pattern ' + JSON.stringify(p.o));
    }
  });
});

test('the bot clears every level from several random layouts', () => {
  for (let n = 1; n <= JumpGuyData.levels.length; n++) {
    for (let seed = 1; seed <= 5; seed++) eq(runBot(JumpGuy.buildLevel(n, seeded(seed * 7 + n)), bot, 9000).ev, 'passed', 'level ' + n + ' seed ' + seed);
  }
});

test('endless: speed grows up to the maximum and never beyond', () => {
  const def = JumpGuy.buildEndless(seeded(3)), E = JumpGuyData.endless;
  eq(def.speedAt(0), E.startSpeed);
  eq(def.speedAt(E.rampDistance / 2) > E.startSpeed && def.speedAt(E.rampDistance / 2) < E.maxSpeed, true);
  eq(def.speedAt(E.rampDistance), E.maxSpeed);
  eq(def.speedAt(1e7), E.maxSpeed);
});

test('endless: obstacles keep appearing ahead and old ones are dropped', () => {
  const sim = JumpGuy.create(JumpGuy.buildEndless(seeded(4)));
  for (let i = 0; i < 20000; i++) {
    sim.update(STEP, { pressed: bot(sim) });
    if (sim.state === 'hit') throw new Error('bot hit at step ' + i);
  }
  eq(sim.dist > 20000, true, 'travelled far');
  eq(sim.def.obstacles.length < 60, true, 'old obstacles pruned: ' + sim.def.obstacles.length);
  eq(sim.def.obstacles.some(o => o.x > sim.dist + 64), true, 'obstacles ahead');
});

test('endless: standing still ends the run on the first obstacle', () => {
  eq(runBot(JumpGuy.buildEndless(seeded(5)), null, 4000).ev, 'hit');
});

test('endless: harder patterns only appear after their distance', () => {
  const def = JumpGuy.buildEndless(seeded(6)), E = JumpGuyData.endless;
  def.extend(E.tierAt[0] - 600);
  const tier1 = JumpGuyData.patterns.filter(p => p.tier === 1).map(p => JSON.stringify(p.o));
  for (const g of def.groups) {
    const sig = JSON.stringify(def.obstacles.filter(o => o.x >= g.x && o.x < g.x + g.span).map(o => [o.x - g.x, o.w, o.h]));
    eq(tier1.includes(sig), true, 'group at ' + g.x);
  }
});

test('obstacles and groups are generated in ascending x', () => {
  for (const def of [JumpGuy.buildLevel(5, seeded(2)), JumpGuy.buildEndless(seeded(2))]) {
    def.extend && def.extend(6000);
    for (const list of [def.obstacles, def.groups]) for (let i = 1; i < list.length; i++) eq(list[i].x >= list[i - 1].x, true);
  }
});

test('settings: sound is on by default, toggling is remembered after reload', () => {
  const st = fakeStorage();
  const s = Settings.create({ storage: st });
  eq(s.muted, false);
  eq(s.toggleMuted(), true);
  eq(Settings.create({ storage: st }).muted, true, 'after reload');
  eq(s.toggleMuted(), false);
  eq(Settings.create({ storage: st }).muted, false, 'unmuted after reload');
});

test('settings: corrupted or unavailable storage gives defaults and still works', () => {
  eq(Settings.create({ storage: fakeStorage({ 'gtj.settings.v1': '{oops' }) }).muted, false);
  eq(Settings.create({ storage: fakeStorage({ 'gtj.settings.v1': '{"muted":"yes"}' }) }).muted, false);
  const broken = { getItem() { throw new Error('no'); }, setItem() { throw new Error('no'); } };
  const s = Settings.create({ storage: broken });
  eq(s.toggleMuted(), true);
});

test('settings are kept apart from progress: resetting progress keeps the sound choice', () => {
  const st = fakeStorage();
  Settings.create({ storage: st }).toggleMuted();
  const p = Progression.create({ storage: st, chapters: CHAPTERS });
  complete(p, 'a', 3);
  p.reset();
  eq(Settings.create({ storage: st }).muted, true);
});

test('replaying a completed chapter restarts at level 1 and keeps the unlocks and the record', () => {
  const p = fresh();
  complete(p, 'a', 3);
  p.submitEndless('a', 40);
  eq(p.startChapter('a'), true);
  eq(p.run, { chapter: 'a', level: 1, lives: 3 });
  eq(p.isChapterUnlocked('b'), true);
  eq(p.record('a'), 40);
});

// ---- Clear the Room ----
{
  const D = ClearTheRoomData, LAYOUT = D.layouts[0];
  const mk = waves => ClearTheRoom.create({ layout: LAYOUT, waves: waves || [['grunt']] });
  const idle = { moveX: 0, moveY: 0, aimX: 0, aimY: 0, fire: false };
  const step = (sim, input, n) => { let ev = null; for (let i = 0; i < (n || 1) && !ev; i++) ev = sim.update(STEP, Object.assign({}, idle, input)); return ev; };
  const spawnNow = (sim, id, x, y) => { const d = D.enemies[id]; const e = { type: id, x, y, size: d.size, hp: d.hp, speed: d.speed, damage: d.damage, spawnT: 0, flash: 0 }; sim.enemies.push(e); return e; };

  test('ctr layouts: valid size, closed by walls, one start, enough spawn points, everything reachable', () => {
    for (const rows of D.layouts) {
      eq(rows.length, 18); for (const r of rows) eq(r.length, 32, 'row width');
      const room = ClearTheRoom.parseLayout(rows);
      eq(room.width, 640); eq(room.height, 360);
      const walls = r => r.replace(/D/g, '#');
      eq(walls(rows[0]), '#'.repeat(32), 'top wall'); eq(walls(rows[17]), '#'.repeat(32), 'bottom wall');
      for (const r of rows) eq(walls(r[0] + r[31]), '##', 'side walls');
      eq(room.doors.length, 2, 'one two-tile exit door');
      eq(room.doors.every(d => d.i === 0 || d.i === 31 || d.j === 0 || d.j === 17), true, 'door in the outer wall');
      eq(rows.join('').split('P').length - 1, 1, 'one player start');
      eq(room.spawns.length >= 4, true, 'spawn points');
      eq(room.spawns.every(s => !room.hits(s.x, s.y, 6)), true, 'spawn points on floor');
      room.openDoors();
      const seen = new Set(), todo = [[Math.floor(room.start.x / 20), Math.floor(room.start.y / 20)]];
      while (todo.length) {
        const [i, j] = todo.pop(), k = i + ',' + j;
        if (seen.has(k) || !room.solid[j] || room.solid[j][i] !== false) continue;
        seen.add(k); todo.push([i + 1, j], [i - 1, j], [i, j + 1], [i, j - 1]);
      }
      const floor = rows.join('').split('').filter(ch => ch !== '#').length;
      eq(seen.size, floor, 'every floor tile and the door reachable');
    }
  });

  test('ctr: the player starts at full health and moves with the keys at the set speed', () => {
    const sim = mk(); sim.player.x = 160; sim.player.y = 310; const x0 = sim.player.x;
    eq(sim.player.hp, D.player.maxHp);
    step(sim, { moveX: 1 }, 60);
    eq(Math.abs(sim.player.x - x0 - D.player.speed) < 1, true, 'one second of movement');
  });

  test('ctr: diagonal movement is not faster than straight movement', () => {
    const sim = mk(); sim.player.x = 160; sim.player.y = 310; const { x, y } = sim.player;
    step(sim, { moveX: 1, moveY: -1 }, 30);
    eq(Math.abs(Math.hypot(sim.player.x - x, sim.player.y - y) - D.player.speed / 2) < 1, true);
  });

  test('ctr: walls stop the player and let it slide along them', () => {
    const sim = mk(); sim.player.x = 30; sim.player.y = 30;
    step(sim, { moveX: -1, moveY: 1 }, 120);
    eq(sim.player.x >= 20 + D.player.size / 2 - 0.01, true, 'did not enter the left wall');
    eq(sim.player.y > 100, true, 'kept sliding down along it');
  });

  test('ctr: holding fire shoots at the set rate, in the aimed direction', () => {
    const sim = mk([[]]); const p = sim.player;
    step(sim, { fire: true, aimX: p.x + 100, aimY: p.y }, 60);
    eq(sim.fx.filter(f => f.type === 'shoot').length, D.player.fireRate, 'shots in one second');
    eq(sim.bullets.every(b => b.vy === 0 && b.vx > 0), true);
    const none = mk(); step(none, { fire: false }, 60); eq(none.bullets.length, 0);
  });

  test('ctr: bullets disappear at their range and on walls', () => {
    const sim = mk([[]]); const p = sim.player;
    step(sim, { fire: true, aimX: p.x, aimY: p.y - 100 }, 1);
    step(sim, { aimX: p.x, aimY: p.y - 100 }, 120);
    eq(sim.bullets.length, 0);
  });

  test('ctr: a grunt dies after as many hits as its health', () => {
    const sim = mk(); const e = spawnNow(sim, 'grunt', sim.player.x + 60, sim.player.y);
    e.speed = 0;
    const hp = D.enemies.grunt.hp;

  const levelCfg = (rooms, extra) => Object.assign({}, D.levels[0], { rooms }, extra);

  test('ctr level: a bot that fights and then walks to the door clears a whole level from several seeds', () => {
    const route = (room, from, to) => {   // BFS over free tiles: returns the first step toward the goal tile
      const T = 20, key = (i, j) => i + ',' + j, goal = key(to.i, to.j), prev = new Map(), queue = [[from.i, from.j]];
      prev.set(key(from.i, from.j), null);
      for (let q = 0; q < queue.length; q++) {
        const [i, j] = queue[q];
        if (key(i, j) === goal) break;
        for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const ni = i + di, nj = j + dj;
          if (room.solid[nj] && room.solid[nj][ni] === false && !prev.has(key(ni, nj))) { prev.set(key(ni, nj), [i, j]); queue.push([ni, nj]); }
        }
      }
      const path = [];
      for (let cur = [to.i, to.j]; cur; cur = prev.get(key(cur[0], cur[1]))) path.push(cur);
      path.reverse();
      const cur = path[1] || path[0];
      return { x: cur[0] * T + T / 2, y: cur[1] * T + T / 2 };
    };
    for (let seed = 1; seed <= 4; seed++) {
      const lv = ClearTheRoom.createLevel({ cfg: levelCfg(3), rng: seeded(seed) });
      let ev = null, rooms = 1;
      for (let i = 0; i < 60 * 240 && ev !== 'passed' && ev !== 'lost'; i++) {
        const sim = lv.sim, p = sim.player, live = sim.enemies.filter(e => e.spawnT <= 0);
        const near = live.slice().sort((a, b) => Math.hypot(a.x - p.x, a.y - p.y) - Math.hypot(b.x - p.x, b.y - p.y))[0];
        let mx = 0, my = 0;
        if (sim.cleared) {
          const door = sim.room.doors[0], step = route(sim.room, { i: Math.floor(p.x / 20), j: Math.floor(p.y / 20) }, door);
          mx = step.x - p.x; my = step.y - p.y;
        } else if (near) {
          const dx = p.x - near.x, dy = p.y - near.y, d = Math.hypot(dx, dy) || 1;
          if (d < 110) { mx = dx / d + (-dy / d) * 0.6; my = dy / d + (dx / d) * 0.6; }
          if (Math.hypot(mx, my) > 0 && sim.room.hits(p.x + mx * 8, p.y + my * 8, 6)) { mx = 320 - p.x; my = 180 - p.y; }
        }
        ev = lv.update(STEP, { moveX: mx, moveY: my, aimX: near ? near.x : p.x + 1, aimY: near ? near.y : p.y, fire: !!near });
        if (ev === 'room') rooms++;
      }
      eq(ev, 'passed', 'seed ' + seed);
      eq(rooms, 3, 'rooms visited, seed ' + seed);
    }
  });

  test('ctr data: five levels with rising difficulty, every type defined, layouts for variety', () => {
    const lv = D.levels;

    sim.updateBullets(STEP);

  test('ctr: a bot that fights its way through every level survives most of the time', () => {
    const route = (room, from, to) => {
      const key = (i, j) => i + ',' + j, goal = key(to.i, to.j), prev = new Map(), queue = [[from.i, from.j]];
      prev.set(key(from.i, from.j), null);
      for (let q = 0; q < queue.length; q++) {
        const [i, j] = queue[q];
        if (key(i, j) === goal) break;
        for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const ni = i + di, nj = j + dj;
          if (room.solid[nj] && room.solid[nj][ni] === false && !prev.has(key(ni, nj))) { prev.set(key(ni, nj), [i, j]); queue.push([ni, nj]); }
        }
      }
      const path = [];
      for (let cur = [to.i, to.j]; cur; cur = prev.get(key(cur[0], cur[1]))) path.push(cur);
      path.reverse();
      const cur = path[1] || path[0];
      return { x: cur[0] * 20 + 10, y: cur[1] * 20 + 10 };
    };
    let passed = 0, total = 0;
    D.levels.forEach((cfg, li) => {
      for (let seed = 1; seed <= 4; seed++) {
        total++;
        const lv = ClearTheRoom.createLevel({ cfg, rng: seeded(seed * 13 + li) });
        let ev = null;
        for (let i = 0; i < 60 * 400 && ev !== 'passed' && ev !== 'lost'; i++) {
          const sim = lv.sim, p = sim.player, live = sim.enemies.filter(e => e.spawnT <= 0);
          const near = live.slice().sort((a, b) => Math.hypot(a.x - p.x, a.y - p.y) - Math.hypot(b.x - p.x, b.y - p.y))[0];
          let mx = 0, my = 0;
          if (sim.cleared) {
            const next = route(sim.room, { i: Math.floor(p.x / 20), j: Math.floor(p.y / 20) }, sim.room.doors[0]);
            mx = next.x - p.x; my = next.y - p.y;
          } else if (near) {
            const dx = p.x - near.x, dy = p.y - near.y, d = Math.hypot(dx, dy) || 1;
            if (d < 120) { mx = dx / d + (-dy / d) * 0.6; my = dy / d + (dx / d) * 0.6; }
            if (Math.hypot(mx, my) > 0 && sim.room.hits(p.x + mx * 8, p.y + my * 8, 6)) { mx = 320 - p.x; my = 180 - p.y; }

    window.__botScore = passed + '/' + total;
  });

        if (near && Math.hypot(mx, my) > 0 && sim.room.hits(p.x + mx * 8, p.y + my * 8, 6)) { mx = 320 - p.x; my = 180 - p.y; }
        ev = sim.update(STEP, { moveX: mx, moveY: my, aimX: near ? near.x : p.x + 1, aimY: near ? near.y : p.y, fire: !!near });

  const mkFarBoss = () => { const sim = mkBoss(); sim.player.hp = sim.player.maxHp = 999; return sim; };
  const secs = n => Math.round(n * 60);

  test('ctr boss: chases, then stands still for a warning before each charge', () => {
    const sim = mkFarBoss(), b = sim.boss;
    eq(b.state, 'chase');
    const y0 = b.y;
    step(sim, {}, secs(4.5));
    eq(b.state, 'chase', 'still chasing before the first charge');
    eq(b.y > y0, true, 'it walks toward the player');
    step(sim, {}, secs(0.7));
    eq(b.state, 'warning', 'warning shown at about 5 s');
    const at = { x: b.x, y: b.y };
    step(sim, {}, secs(0.5));
    eq({ x: b.x, y: b.y }, at, 'it does not move during the warning');
  });

  test('ctr boss: after the warning it dashes toward where the player was, at the dash speed, then chases again', () => {
    const sim = mkFarBoss(), b = sim.boss;
    step(sim, {}, secs(5.1));
    eq(b.state, 'warning');
    const toPlayer = { x: sim.player.x - b.x, y: sim.player.y - b.y }, len = Math.hypot(toPlayer.x, toPlayer.y);
    step(sim, {}, secs(1));   // the warning ends
    eq(b.state, 'charge');
    const before = { x: b.x, y: b.y };
    step(sim, {}, 1);
    const moved = Math.hypot(b.x - before.x, b.y - before.y);
    eq(Math.abs(moved - D.boss.charge.speed * STEP) < 0.5, true, 'dash speed, moved ' + moved);
    const dir = { x: (b.x - before.x) / moved, y: (b.y - before.y) / moved };
    eq(Math.abs(dir.x - toPlayer.x / len) < 0.05 && Math.abs(dir.y - toPlayer.y / len) < 0.05, true, 'dash heads for the player');
    step(sim, {}, secs(1));
    eq(b.state, 'chase', 'back to chasing');
  });

  test('ctr boss: touching it costs 1 health, being hit by its charge costs 2', () => {
    const touch = state => {
      const sim = mkBoss(), b = sim.boss;
      b.state = state; b.timer = 1; b.dirX = 0; b.dirY = 0;
      sim.player.x = b.x; sim.player.y = b.y;
      const hp = sim.player.hp;
      step(sim, {}, 1);
      return hp - sim.player.hp;
    };
    eq(touch('chase'), 1, 'chasing');
    eq(touch('charge'), D.boss.charge.damage, 'charging');
  });
