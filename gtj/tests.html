<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>GtJ - test</title>
<style>
  body { font: 14px/1.5 monospace; background: #111; color: #ddd; margin: 16px; }
  .pass { color: #6c6; } .fail { color: #f66; }
  h1 { font-size: 16px; }
</style>
</head>
<body>
<h1 id="summary">Esecuzione...</h1>
<pre id="out"></pre>
<script src="progression.js"></script>
<script src="jumpguy-data.js"></script>
<script src="jumpguy.js"></script>
<script>
// Tiny test runner: open this file in a browser, no server needed.
const results = [];
function test(name, fn) {
  try { fn(); results.push({ name, ok: true }); }
  catch (e) { results.push({ name, ok: false, err: e.message }); }
}
function eq(actual, expected, label) {
  if (JSON.stringify(actual) !== JSON.stringify(expected)) {
    throw new Error((label ? label + ': ' : '') + 'expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual));
  }
}

// Fake storage standing in for localStorage.
function fakeStorage(initial) {
  const data = Object.assign({}, initial);
  return {
    data,
    getItem(k) { return k in data ? data[k] : null; },
    setItem(k, v) { data[k] = String(v); },
    removeItem(k) { delete data[k]; },
  };
}

// Independent fixture: 3 chapters, deliberately not the real game data.
const CHAPTERS = [
  { id: 'a', levels: 3 },
  { id: 'b', levels: 2 },
  { id: 'c', levels: 2 },
];
function fresh(storage) { return Progression.create({ storage: storage || fakeStorage(), chapters: CHAPTERS }); }

// ---- tests ----
test('at the start only the first chapter is unlocked', () => {
  const p = fresh();
  eq(p.isChapterUnlocked('a'), true, 'a');
  eq(p.isChapterUnlocked('b'), false, 'b');
  eq(p.isChapterUnlocked('c'), false, 'c');
});

test('starting a chapter gives level 1 and 3 lives', () => {
  const p = fresh();
  eq(p.startChapter('a'), true);
  eq(p.run, { chapter: 'a', level: 1, lives: 3 });
});

test('a locked chapter cannot be started', () => {
  const p = fresh();
  eq(p.startChapter('b'), false);
  eq(p.run, null);
});

test('passing a level moves to the next one', () => {
  const p = fresh();
  p.startChapter('a');
  eq(p.levelPassed(), { chapterCompleted: false });
  eq(p.run, { chapter: 'a', level: 2, lives: 3 });
});

test('losing a life keeps the level and lives are not refilled by the next level', () => {
  const p = fresh();
  p.startChapter('a');
  eq(p.lifeLost(), { gameOver: false });
  eq(p.run, { chapter: 'a', level: 1, lives: 2 });
  p.levelPassed();
  eq(p.run, { chapter: 'a', level: 2, lives: 2 });
});

test('losing the last life restarts the chapter from level 1 with 3 lives', () => {
  const p = fresh();
  p.startChapter('a');
  p.levelPassed();
  p.lifeLost();
  p.lifeLost();
  eq(p.lifeLost(), { gameOver: true });
  eq(p.run, { chapter: 'a', level: 1, lives: 3 });
});

function complete(p, id, levels) {
  p.startChapter(id);
  let r;
  for (let i = 0; i < levels; i++) r = p.levelPassed();
  return r;
}

test('endless is locked until its chapter is completed', () => {
  const p = fresh();
  eq(p.isEndlessUnlocked('a'), false);
  p.startChapter('a');
  p.levelPassed();
  eq(p.isEndlessUnlocked('a'), false);
});

test('completing a chapter unlocks the next chapter and its own endless only', () => {
  const p = fresh();
  eq(complete(p, 'a', 3), { chapterCompleted: true });
  eq(p.run, null);
  eq(p.isChapterCompleted('a'), true);
  eq(p.isChapterUnlocked('b'), true);
  eq(p.isChapterUnlocked('c'), false);
  eq(p.isEndlessUnlocked('a'), true);
  eq(p.isEndlessUnlocked('b'), false);
});

test('unlocks survive a game over in a later chapter', () => {
  const p = fresh();
  complete(p, 'a', 3);
  p.startChapter('b');
  p.lifeLost(); p.lifeLost(); p.lifeLost();
  eq(p.isChapterCompleted('a'), true);
  eq(p.isChapterUnlocked('b'), true);
  eq(p.isEndlessUnlocked('a'), true);
});

test('a completed chapter can be replayed from level 1 without losing unlocks', () => {
  const p = fresh();
  complete(p, 'a', 3);
  eq(p.startChapter('a'), true);
  eq(p.run, { chapter: 'a', level: 1, lives: 3 });
  p.lifeLost(); p.lifeLost(); p.lifeLost();
  eq(p.isChapterUnlocked('b'), true);
  eq(p.isEndlessUnlocked('a'), true);
});

test('endless record starts at 0 and updates only when beaten', () => {
  const p = fresh();
  complete(p, 'a', 3);
  eq(p.record('a'), 0);
  eq(p.submitEndless('a', 120), true);
  eq(p.record('a'), 120);
  eq(p.submitEndless('a', 80), false);
  eq(p.submitEndless('a', 120), false);
  eq(p.record('a'), 120);
  eq(p.submitEndless('a', 121), true);
  eq(p.record('a'), 121);
});

test('records are kept per chapter', () => {
  const p = fresh();
  complete(p, 'a', 3);
  complete(p, 'b', 2);
  p.submitEndless('a', 10);
  p.submitEndless('b', 99);
  eq([p.record('a'), p.record('b'), p.record('c')], [10, 99, 0]);
});

test('an endless score is ignored while that endless is locked', () => {
  const p = fresh();
  eq(p.submitEndless('a', 50), false);
  eq(p.record('a'), 0);
});

test('a reloaded game resumes at the saved level and lives', () => {
  const s = fakeStorage();
  const p = fresh(s);
  complete(p, 'a', 3);
  p.submitEndless('a', 42);
  p.startChapter('b');
  p.lifeLost();
  const q = fresh(s);
  eq(q.run, { chapter: 'b', level: 1, lives: 2 });
  eq(q.isChapterCompleted('a'), true);
  eq(q.isChapterUnlocked('b'), true);
  eq(q.record('a'), 42);
});

test('a reloaded game remembers a level passed mid-chapter', () => {
  const s = fakeStorage();
  const p = fresh(s);
  p.startChapter('a');
  p.levelPassed();
  eq(fresh(s).run, { chapter: 'a', level: 2, lives: 3 });
});

test('a game over is saved as a fresh attempt at level 1', () => {
  const s = fakeStorage();
  const p = fresh(s);
  p.startChapter('a');
  p.levelPassed();
  p.lifeLost(); p.lifeLost(); p.lifeLost();
  eq(fresh(s).run, { chapter: 'a', level: 1, lives: 3 });
});

test('reset returns to the initial state, also after reload', () => {
  const s = fakeStorage();
  const p = fresh(s);
  complete(p, 'a', 3);
  p.submitEndless('a', 42);
  p.startChapter('b');
  p.reset();
  for (const g of [p, fresh(s)]) {
    eq(g.run, null);
    eq(g.isChapterUnlocked('a'), true);
    eq(g.isChapterUnlocked('b'), false);
    eq(g.isChapterCompleted('a'), false);
    eq(g.record('a'), 0);
  }
});

test('missing or corrupted saves give a valid initial state', () => {
  const bad = [
    'not json at all',
    '{"v":1,',
    'null',
    '42',
    '"text"',
    '{"v":1,"completed":"a","records":[],"run":7}',
  ];
  for (const raw of bad) {
    const p = fresh(fakeStorage({ [Progression.KEY]: raw }));
    eq(p.run, null, raw);
    eq(p.isChapterUnlocked('a'), true, raw);
    eq(p.isChapterUnlocked('b'), false, raw);
    eq(p.record('a'), 0, raw);
  }
});

test('nonsense values inside a readable save are discarded', () => {
  const save = {
    v: 1,
    completed: ['zzz', 'b'],            // unknown chapter, and b without a completed
    records: { a: -5, b: 'x', zzz: 9 },
    run: { chapter: 'c', level: 1, lives: 3 }, // c is locked
  };
  const p = fresh(fakeStorage({ [Progression.KEY]: JSON.stringify(save) }));
  eq(p.run, null);
  eq(p.isChapterUnlocked('c'), false);
  eq([p.record('a'), p.record('b')], [0, 0]);
});

test('a saved run with out-of-range level or lives is discarded', () => {
  for (const run of [
    { chapter: 'a', level: 99, lives: 3 },
    { chapter: 'a', level: 0, lives: 3 },
    { chapter: 'a', level: 1, lives: 0 },
    { chapter: 'a', level: 1, lives: 9 },
    { chapter: 'a', level: 1.5, lives: 3 },
  ]) {
    const raw = JSON.stringify({ v: 1, completed: [], records: {}, run });
    eq(fresh(fakeStorage({ [Progression.KEY]: raw })).run, null, JSON.stringify(run));
  }
});

test('the game still works when storage is unavailable', () => {
  const broken = {
    getItem() { throw new Error('denied'); },
    setItem() { throw new Error('denied'); },
    removeItem() { throw new Error('denied'); },
  };
  const p = fresh(broken);
  eq(p.startChapter('a'), true);
  p.levelPassed();
  eq(p.run, { chapter: 'a', level: 2, lives: 3 });
  p.reset();
  eq(p.run, null);
});

test('level and life events without an active run are ignored', () => {
  const p = fresh();
  eq(p.levelPassed(), null);
  eq(p.lifeLost(), null);
  complete(p, 'a', 3);
  eq(p.levelPassed(), null, 'double signal after the last level');
  eq(p.lifeLost(), null);
  eq(p.run, null);
  eq(p.isChapterCompleted('a'), true);
  eq(p.isChapterCompleted('b'), false);
});

test('endless scores that are not finite numbers are ignored', () => {
  const p = fresh();
  complete(p, 'a', 3);
  for (const bad of [NaN, Infinity, '50', null, undefined]) eq(p.submitEndless('a', bad), false, String(bad));
  eq(p.record('a'), 0);
});


// ---- Jump Guy ----
const STEP = 1 / 60;
function seeded(seed) { // mulberry32, so level layouts are reproducible in tests
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const LEVEL1 = JumpGuy.buildLevel(1, seeded(1));
// Runs a level with a simple bot; jumpWhen(sim) decides when to press.
function runBot(def, jumpWhen, maxSteps) {
  const sim = JumpGuy.create(def);
  for (let i = 0; i < (maxSteps || 6000); i++) {
    const ev = sim.update(STEP, { pressed: !!jumpWhen && jumpWhen(sim) });
    if (ev) return { ev, sim, steps: i + 1 };
  }
  return { ev: null, sim };
}
// Jumps so that the middle of the next obstacle group is under the runner at the top of the arc.
const bot = sim => {
  if (!sim.grounded) return false;
  const rear = sim.dist + JumpGuy.PLAYER_X, center = rear + JumpGuy.PLAYER_W / 2;
  const g = sim.def.groups.find(g => g.x + g.span > rear);
  return !!g && g.x + g.span / 2 - center <= (sim.def.speedAt ? sim.def.speedAt(sim.dist) : sim.def.speed) * 0.37;
};

test('doing nothing hits the first obstacle', () => {
  const r = runBot(LEVEL1, null);
  eq(r.ev, 'hit');
  eq(r.sim.state, 'hit');
});

test('jumping before each obstacle reaches the finish', () => {
  const r = runBot(LEVEL1, bot);
  eq(r.ev, 'passed');
});

test('a finished level reports its event only once', () => {
  const r = runBot(LEVEL1, bot);
  eq(r.sim.update(STEP, { pressed: true }), null);
  const h = runBot(LEVEL1, null);
  eq(h.sim.update(STEP, {}), null);
});

test('the jump button lifts the runner and gravity brings it back', () => {
  const sim = JumpGuy.create({ length: 9999, obstacles: [] });
  sim.update(STEP, { pressed: true });
  eq(sim.grounded, false);
  let peak = sim.y;
  for (let i = 0; i < 120; i++) { sim.update(STEP, {}); peak = Math.min(peak, sim.y); }
  eq(sim.grounded, true);
  eq(peak < JumpGuy.GROUND - 50, true, 'jump is high enough');
});

test('a jump pressed slightly before landing still fires (buffer)', () => {
  const sim = JumpGuy.create({ length: 9999, obstacles: [] });
  sim.update(STEP, { pressed: true });
  while (sim.y < JumpGuy.GROUND - 4) sim.update(STEP, {}); // nearly landed
  sim.update(STEP, { pressed: true });
  for (let i = 0; i < 20; i++) sim.update(STEP, {});
  eq(sim.grounded, false, 'airborne again after landing');
});

test('a jump pressed just after leaving the ground still fires (edge tolerance)', () => {
  const sim = JumpGuy.create({ length: 9999, obstacles: [] });
  sim.grounded = false; sim.sinceGround = 0.05; sim.vy = 0; sim.y = JumpGuy.GROUND - 1;
  sim.update(STEP, { pressed: true });
  eq(sim.vy < 0, true);
});

test('an obstacle grazing the edge of the hitbox is forgiven', () => {
  const x = JumpGuy.PLAYER_X + JumpGuy.PLAYER_W + 1; // overlaps by 1px, less than the forgiveness
  const sim = JumpGuy.create({ length: 9999, obstacles: [{ x, w: 14, h: 14 }] });
  eq(sim.hitsObstacle(), false);
});

test('level data: about 5 levels, speed never decreases and ends at the maximum', () => {
  const lv = JumpGuyData.levels;
  eq(lv.length >= 4 && lv.length <= 6, true, 'about 5 levels');
  for (let i = 1; i < lv.length; i++) eq(lv[i].speed >= lv[i - 1].speed, true, 'speed at level ' + (i + 1));
  eq(lv[lv.length - 1].speed, Math.max(...lv.map(l => l.speed)));
});

test('there are 20 to 30 obstacle patterns', () => {
  const n = JumpGuyData.patterns.length;
  eq(n >= 20 && n <= 30, true, String(n));
});

test('every level has patterns in random order and varies between builds', () => {
  const a = JumpGuy.buildLevel(5, seeded(1)), b = JumpGuy.buildLevel(5, seeded(2));
  eq(a.obstacles.length > 10, true);
  eq(JSON.stringify(a.obstacles) !== JSON.stringify(b.obstacles), true);
});

test('lower levels only use patterns up to their tier', () => {
  const easy = JumpGuyData.patterns.filter(p => p.tier <= JumpGuyData.levels[0].maxTier);
  const maxH = Math.max(...easy.flatMap(p => p.o.map(o => o[2])));
  for (let s = 1; s <= 5; s++) eq(JumpGuy.buildLevel(1, seeded(s)).obstacles.every(o => o.h <= maxH), true);
});

test('every pattern can be cleared with one jump at every level speed it appears in', () => {
  JumpGuyData.levels.forEach((cfg, li) => {
    for (const p of JumpGuyData.patterns.filter(p => p.tier <= cfg.maxTier)) {
      const obstacles = p.o.map(([dx, w, h]) => ({ x: 200 + dx, w, h }));
      let cleared = false;
      for (let start = 0; start < 200 && !cleared; start++) { // try every jump moment
        const sim = JumpGuy.create({ length: 420, speed: cfg.speed, obstacles });
        let ev = null;
        for (let i = 0; i < 400 && !ev; i++) ev = sim.update(STEP, { pressed: i === start });
        cleared = ev === 'passed';
      }
      eq(cleared, true, 'level ' + (li + 1) + ' pattern ' + JSON.stringify(p.o));
    }
  });
});

test('the bot clears every level from several random layouts', () => {
  for (let n = 1; n <= JumpGuyData.levels.length; n++) {
    for (let seed = 1; seed <= 5; seed++) eq(runBot(JumpGuy.buildLevel(n, seeded(seed * 7 + n)), bot, 9000).ev, 'passed', 'level ' + n + ' seed ' + seed);
  }
});

test('endless: speed grows up to the maximum and never beyond', () => {
  const def = JumpGuy.buildEndless(seeded(3)), E = JumpGuyData.endless;
  eq(def.speedAt(0), E.startSpeed);
  eq(def.speedAt(E.rampDistance / 2) > E.startSpeed && def.speedAt(E.rampDistance / 2) < E.maxSpeed, true);
  eq(def.speedAt(E.rampDistance), E.maxSpeed);
  eq(def.speedAt(1e7), E.maxSpeed);
});

test('endless: obstacles keep appearing ahead and old ones are dropped', () => {
  const sim = JumpGuy.create(JumpGuy.buildEndless(seeded(4)));
  for (let i = 0; i < 20000; i++) {
    sim.update(STEP, { pressed: bot(sim) });
    if (sim.state === 'hit') throw new Error('bot hit at step ' + i);
  }
  eq(sim.dist > 20000, true, 'travelled far');
  eq(sim.def.obstacles.length < 60, true, 'old obstacles pruned: ' + sim.def.obstacles.length);
  eq(sim.def.obstacles.some(o => o.x > sim.dist + 64), true, 'obstacles ahead');
});

test('endless: standing still ends the run on the first obstacle', () => {
  eq(runBot(JumpGuy.buildEndless(seeded(5)), null, 4000).ev, 'hit');
});

test('endless: harder patterns only appear after their distance', () => {
  const def = JumpGuy.buildEndless(seeded(6)), E = JumpGuyData.endless;
  def.extend(E.tierAt[0] - 600);
  const maxEarly = Math.max(...def.obstacles.map(o => o.h));
  const tier1 = Math.max(...JumpGuyData.patterns.filter(p => p.tier === 1).flatMap(p => p.o.map(o => o[2])));
  eq(maxEarly <= tier1, true);
});

// ---- report ----
const failed = results.filter(r => !r.ok).length;
document.getElementById('summary').textContent = failed ? 'FAIL ' + failed + ' / ' + results.length : 'PASS ' + results.length + ' / ' + results.length;
document.getElementById('summary').className = failed ? 'fail' : 'pass';
document.getElementById('out').textContent = results.map(r => (r.ok ? 'ok   ' : 'FAIL ') + r.name + (r.ok ? '' : '\n       ' + r.err)).join('\n');
</script>
</body>
