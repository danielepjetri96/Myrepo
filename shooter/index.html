<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pixel Siege</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0d0e17;
    display: flex; align-items: center; justify-content: center;
  }
  html, body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; cursor: none; image-rendering: pixelated; }
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: #0d0e17; color: #ffcd75; text-align: center;
    font: 14px/1.8 'Press Start 2P', monospace;
    align-items: center; justify-content: center; padding: 16px;
  }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="rotate">ROTATE YOUR PHONE<br>TO PLAY</div>

  <script src="js/audio.js"></script>
  <script src="js/save.js"></script>
  <script src="js/input.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
